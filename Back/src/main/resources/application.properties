spring.config.import=optional:classpath:secrets.properties

spring.application.name=Back
server.port=8080

#conexion base
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/BDMEDIAWESECO?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#jpa/hibernate
spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#configuraciones de correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jacsonaulla@gmail.com
spring.mail.password=${MAIL_PASSWORD}   
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

#configuraciones jwt
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CREDENCIALES GOOGLE
google.client.id=${GOOGLE_CLIENT_ID}